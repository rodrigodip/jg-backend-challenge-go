name: jg-wallet

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgressecret}
      POSTGRES_DB: postgres
      OWNER_PASSWORD: ${OWNER_PASSWORD:-ownersecret}
      APP_PASSWORD: ${APP_PASSWORD:-appsecret}
    volumes:
      # PG 18 layout: single mount at /var/lib/postgresql (see
      # docker-library/postgres#1259), data lives in a subdirectory.
      - pgdata:/var/lib/postgresql
      - ./deployments/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host uses 5433: the developer machine already runs a system
      # PostgreSQL on 5432. Containers keep talking to postgres:5432.
      - "5433:5432"
    # Dev convenience: resume what was running after a host reboot.
    # The migrate job keeps restart "no" (one-shot by design).
    restart: unless-stopped

  ministack:
    image: ministackorg/ministack:1.5.13
    ports:
      - "4566:4566"
    volumes:
      - ./deployments/ministack/ready.d:/docker-entrypoint-initaws.d/ready.d:ro
      - ./deployments/ministack/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-adminsecret}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deployments/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      # No curl/wget/python in the image: raw HTTP over bash /dev/tcp.
      # Keycloak answers {"status":"UP",...} on the :9000 management port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\": *\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["/app/migrate", "-command", "up"]
    environment:
      DATABASE_URL: postgres://owner:${OWNER_PASSWORD:-ownersecret}@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["/app/app", "-mode", "api"]
    environment:
      APP_MODE: api
      HTTP_ADDR: :8080
      ADMIN_ADDR: :9090
      DATABASE_URL: postgres://app:${APP_PASSWORD:-appsecret}@postgres:5432/wallet?sslmode=disable
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-appuser}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-appsecret}
      OIDC_ISSUER: http://keycloak:8080/realms/wallet
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: .
    command: ["/app/app", "-mode", "consumer"]
    environment:
      APP_MODE: consumer
      HTTP_ADDR: :8080
      ADMIN_ADDR: :9090
      DATABASE_URL: postgres://app:${APP_PASSWORD:-appsecret}@postgres:5432/wallet?sslmode=disable
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${SQS_CONSUMER_KEY:-consumeruser}
      AWS_SECRET_ACCESS_KEY: ${SQS_CONSUMER_SECRET:-consumersecret}
      OIDC_ISSUER: http://keycloak:8080/realms/wallet
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy
    restart: unless-stopped

  workers:
    build: .
    command: ["/app/app", "-mode", "workers"]
    environment:
      APP_MODE: workers
      HTTP_ADDR: :8080
      ADMIN_ADDR: :9090
      DATABASE_URL: postgres://app:${APP_PASSWORD:-appsecret}@postgres:5432/wallet?sslmode=disable
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${SQS_PUBLISHER_KEY:-publisheruser}
      AWS_SECRET_ACCESS_KEY: ${SQS_PUBLISHER_SECRET:-publishersecret}
      OIDC_ISSUER: http://keycloak:8080/realms/wallet
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
